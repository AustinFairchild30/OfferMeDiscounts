name: Sync Awin deals

# Manual trigger only. This existed on a weekly schedule when an Awin sync
# meant paging the entire ~31,000-row promotions feed; filters:{membership:
# "joined"} reduced that to a single request, so it rejoined the nightly job.

# No schedule any more — Awin is part of the nightly sync again now that the
# membership filter makes it one request instead of 156. Kept for triggering a
# sync by hand.
on:
  workflow_dispatch: {}

env:
  SITE_URL: https://offermediscounts.onrender.com

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger Awin sync
        run: |
          response=$(curl -s --max-time 900 -w "\n%{http_code}" -X POST "$SITE_URL/api/cron/sync-awin" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" -ne 200 ]; then
            echo "Awin sync failed with HTTP $http_code"
            exit 1
          fi
