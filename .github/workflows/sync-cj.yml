name: Sync CJ deals

on:
  schedule:
    # Runs once a day at 13:00 UTC (~9am ET). Adjust as needed —
    # https://crontab.guru is helpful for changing the schedule.
    - cron: "0 13 * * *"
  workflow_dispatch: {} # lets you trigger a sync manually from the Actions tab

env:
  # The www host, not the apex: offermediscounts.com answers a 301 to
  # www.offermediscounts.com, this curl has no -L, and the step below treats
  # anything that isn't a 200 as a failure. The onrender.com hostname this
  # replaced still works, but it is not the address the site is served at and
  # nothing guarantees Render keeps answering on it.
  SITE_URL: https://www.offermediscounts.com

jobs:
  sync:
    runs-on: ubuntu-latest
    # Without this a hung request sits on a runner until GitHub's six-hour
    # default kills it, and a daily job doing that eats a month of Actions
    # minutes. The sync itself is seconds of work; ten minutes is already
    # generous.
    timeout-minutes: 10
    steps:
      - name: Trigger CJ sync
        run: |
          response=$(curl -s --max-time 540 -w "\n%{http_code}" -X POST "$SITE_URL/api/cron/sync-cj" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" -ne 200 ]; then
            echo "Sync failed with HTTP $http_code"
            exit 1
          fi
