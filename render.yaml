# NOT the source of truth. This service was created by hand in the Render
# dashboard rather than from this blueprint, so the dashboard's own settings
# win and edits here do not reach it — `plan: starter` was set by clicking
# through the UI, and a startCommand added to this file on 1 Oct never ran,
# which is how a migration silently stopped happening for three weeks.
#
# Treat this as documentation of the intended configuration, and make real
# changes in the dashboard: Settings -> Build & Deploy. Keep the two in step.

services:
  - type: web
    name: offermediscounts
    runtime: node
    # Starter, not free. A free web service spins down after ~15 minutes of
    # inactivity, and at roughly one visitor a day this one is asleep almost
    # always — so nearly every real visitor and nearly every crawl paid a
    # 30-60s cold start before seeing anything. A homepage request timed out
    # at 15s while every warm request answered in ~0.2s. That is a steep
    # price for the few visitors there are, and it quietly undermines the SEO
    # work, which is the one channel being invested in.
    plan: starter
    # Deliberately no rootDir. This service serves the whole repo, not just
    # backend/ — server.js does express.static(path.join(__dirname, "..")),
    # so index.html, about.html, css/ and js/ are all served from the repo
    # root. With rootDir: backend, Render only auto-deployed commits that
    # touched backend/**, so every frontend-only commit sat undeployed until
    # an unrelated backend change happened to flush it through.
    # The commands cd in so npm and dotenv still resolve against backend/.
    buildCommand: cd backend && npm install
    # Schema changes apply here, before the start command, not by hand.
    #
    # The reason is on the record twice. Adding awin_promotion_id to the deals
    # SELECT put the column in the code before it was in the database and took
    # the site down on boot. Adding funnel_events.landing_path did the quieter
    # version of the same thing: /api/track swallows errors by design, so every
    # event was discarded for a day while the endpoint kept answering 200.
    #
    # It is `npm run schema`, not `npm run migrate`: migrate also seeds deals
    # and imports users from data/users.json, and an unattended data import on
    # every deploy is not something to leave armed. schema.sql is entirely
    # IF NOT EXISTS, so this is idempotent and safe to re-run.
    #
    # Pre-deploy rather than folded into startCommand, which is what this file
    # claimed for three weeks: pre-deploy runs once per deploy instead of on
    # every restart, crash recovery and scale event, and a failure here cancels
    # the deploy with the previous version still serving.
    preDeployCommand: cd backend && npm run schema
    startCommand: cd backend && npm start
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CJ_PERSONAL_ACCESS_TOKEN
        sync: false
      - key: CJ_WEBSITE_ID
        sync: false
      - key: CRON_SECRET
        sync: false
      # Awin, the third network. Both are required before any Awin sync runs;
      # without them runAwinSync returns "not configured" and the other two
      # networks carry on untouched.
      - key: AWIN_API_TOKEN
        sync: false
      - key: AWIN_PUBLISHER_ID
        sync: false
      # Google Search Console HTML-file verification. Set this to the exact
      # filename Google gives you (e.g. google1a2b3c4d.html) and the server
      # serves it — no code change or deploy needed to verify.
      - key: GOOGLE_VERIFICATION_FILE
        sync: false
