services:
  - type: web
    name: offermediscounts
    runtime: node
    plan: free
    # Deliberately no rootDir. This service serves the whole repo, not just
    # backend/ — server.js does express.static(path.join(__dirname, "..")),
    # so index.html, about.html, css/ and js/ are all served from the repo
    # root. With rootDir: backend, Render only auto-deployed commits that
    # touched backend/**, so every frontend-only commit sat undeployed until
    # an unrelated backend change happened to flush it through.
    # The commands cd in so npm and dotenv still resolve against backend/.
    buildCommand: cd backend && npm install
    # Migrations run on boot, not by hand. Adding awin_promotion_id to the
    # deals SELECT proved why: the column was in the code before it was in the
    # database, and every read threw errorMissingColumn — the whole site down
    # until someone remembered a manual step that nothing documents at deploy
    # time. schema.sql is entirely IF NOT EXISTS, so this is idempotent, and a
    # migration that does fail now fails the boot loudly with the previous
    # version still serving, instead of shipping a crash.
    startCommand: cd backend && npm run migrate && npm start
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CJ_PERSONAL_ACCESS_TOKEN
        sync: false
      - key: CJ_WEBSITE_ID
        sync: false
      - key: CRON_SECRET
        sync: false
      # Awin, the third network. Both are required before any Awin sync runs;
      # without them runAwinSync returns "not configured" and the other two
      # networks carry on untouched.
      - key: AWIN_API_TOKEN
        sync: false
      - key: AWIN_PUBLISHER_ID
        sync: false
      # Google Search Console HTML-file verification. Set this to the exact
      # filename Google gives you (e.g. google1a2b3c4d.html) and the server
      # serves it — no code change or deploy needed to verify.
      - key: GOOGLE_VERIFICATION_FILE
        sync: false
